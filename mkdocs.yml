site_name: STI2D SIN
site_description: Cours, TD, TP et projets – spécialité Systèmes d'Information et Numérique
docs_dir: docs

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Mode clair

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - pymdownx.details          # ??? solution (collapsible)
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - toc:
      permalink: true

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/video.js
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
