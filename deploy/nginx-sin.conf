# /etc/nginx/sites-available/sin  (then: ln -s ../sites-available/sin /etc/nginx/sites-enabled/)
server
{
    listen 80;
    listen [::]:80;
    server_name sin.lan;                    # adapt: local name or public domain

    root /var/www/sin;
    index index.html;
    charset utf-8;

    location /
    {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Static assets: let browsers cache them.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$
    {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Videos: allow seeking.
    location ~* \.(mp4|webm)$
    {
        add_header Accept-Ranges bytes;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
