<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 280' width='760' height='280' font-family='DejaVu Sans, Arial, sans-serif' font-size='13'><rect width='760' height='280' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#666666'/></marker><marker id='aro' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#e8692e'/></marker></defs><text x='24.0' y='28.0' font-size='15' text-anchor='start' font-weight='700' fill='#222222'>Une interruption suspend loop() le temps de l'ISR, puis loop() reprend</text><text x='120.0' y='84.0' font-size='12' text-anchor='end' font-weight='700' fill='#222222'>Entrée D2</text><path d='M130 96H220V66H330V96H460V66H570V96H720' fill='none' stroke='#1f6fd1' stroke-width='2'/><text x='120.0' y='148.0' font-size='12' text-anchor='end' font-weight='700' fill='#222222'>loop()</text><text x='120.0' y='164.0' font-size='11' text-anchor='end' font-weight='400' fill='#666666'>LCD, calculs</text><text x='120.0' y='208.0' font-size='12' text-anchor='end' font-weight='700' fill='#e8692e'>ISR</text><text x='120.0' y='224.0' font-size='11' text-anchor='end' font-weight='400' fill='#666666'>onRisingEdge()</text><rect x='130' y='138' width='90' height='24' rx='4' fill='#eef3fb' stroke='#1f6fd1'/><rect x='238' y='138' width='222' height='24' rx='4' fill='#eef3fb' stroke='#1f6fd1'/><rect x='478' y='138' width='242' height='24' rx='4' fill='#eef3fb' stroke='#1f6fd1'/><rect x='220' y='198' width='18' height='24' rx='3' fill='#e8692e'/><line x1='220.0' y1='98.0' x2='220.0' y2='196.0' stroke='#c0392b' stroke-width='1.25' stroke-dasharray='4 3' marker-end='url(#ar)'/><path d='M229 164V196' fill='none' stroke='#e8692e' stroke-width='1.25' marker-end='url(#aro)'/><path d='M238 210 H250 V166' fill='none' stroke='#e8692e' stroke-width='1.25' marker-end='url(#aro)'/><rect x='460' y='198' width='18' height='24' rx='3' fill='#e8692e'/><line x1='460.0' y1='98.0' x2='460.0' y2='196.0' stroke='#c0392b' stroke-width='1.25' stroke-dasharray='4 3' marker-end='url(#ar)'/><path d='M469 164V196' fill='none' stroke='#e8692e' stroke-width='1.25' marker-end='url(#aro)'/><path d='M478 210 H490 V166' fill='none' stroke='#e8692e' stroke-width='1.25' marker-end='url(#aro)'/><text x='250.0' y='120.0' font-size='11.5' text-anchor='start' font-weight='400' fill='#222222'>1. front montant : le processeur</text><text x='250.0' y='134.0' font-size='11.5' text-anchor='start' font-weight='400' fill='#222222'>suspend loop()</text><text x='140.0' y='248.0' font-size='11.5' text-anchor='start' font-weight='400' fill='#222222'>2. l'ISR note micros() :</text><text x='140.0' y='262.0' font-size='11.5' text-anchor='start' font-weight='400' fill='#222222'>quelques µs seulement</text><text x='500.0' y='248.0' font-size='11.5' text-anchor='start' font-weight='400' fill='#222222'>3. loop() reprend exactement</text><text x='500.0' y='262.0' font-size='11.5' text-anchor='start' font-weight='400' fill='#222222'>là où elle s'était arrêtée</text><text x='600.0' y='120.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#666666'>loop() ne surveille jamais D2 :</text><text x='600.0' y='134.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#666666'>aucun front n'est raté</text></svg>