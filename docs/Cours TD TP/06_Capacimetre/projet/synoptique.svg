<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 284' width='760' height='284' font-family='DejaVu Sans, Arial, sans-serif' font-size='13'><rect width='760' height='284' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#666666'/></marker><marker id='aro' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#e8692e'/></marker></defs><text x='24.0' y='28.0' font-size='15' text-anchor='start' font-weight='700' fill='#222222'>Capacimètre : C se mesure à travers la fréquence</text><rect x='24' y='64' width='156' height='96' rx='8' fill='#fdf0e8' stroke='#e8692e' stroke-width='2'/><text x='102.0' y='92.0' font-size='13' text-anchor='middle' font-weight='700' fill='#222222'>Cx à mesurer</text><text x='102.0' y='116.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#666666'>condensateur</text><text x='102.0' y='134.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#666666'>inconnu</text><rect x='204' y='64' width='156' height='96' rx='8' fill='#eef3fb' stroke='#1f6fd1' stroke-width='1.5'/><text x='282.0' y='92.0' font-size='13' text-anchor='middle' font-weight='700' fill='#222222'>NE555 astable</text><text x='282.0' y='116.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#666666'>R1 = 10 kΩ</text><text x='282.0' y='134.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#666666'>R2 = 68 kΩ</text><rect x='384' y='64' width='156' height='96' rx='8' fill='#eef3fb' stroke='#1f6fd1' stroke-width='1.5'/><text x='462.0' y='92.0' font-size='13' text-anchor='middle' font-weight='700' fill='#222222'>Arduino Uno</text><text x='462.0' y='116.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#666666'>mesure T sur D2</text><text x='462.0' y='134.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#666666'>calcule Cx</text><rect x='564' y='64' width='156' height='96' rx='8' fill='#eef3fb' stroke='#1f6fd1' stroke-width='1.5'/><text x='642.0' y='92.0' font-size='13' text-anchor='middle' font-weight='700' fill='#222222'>LCD 16×2 I2C</text><text x='642.0' y='116.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#666666'>C = 4,70 µF</text><text x='642.0' y='134.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#666666'>f = 2,10 Hz</text><line x1='180.0' y1='112.0' x2='202.0' y2='112.0' stroke='#666666' stroke-width='1.5' marker-end='url(#ar)'/><line x1='360.0' y1='112.0' x2='382.0' y2='112.0' stroke='#666666' stroke-width='1.5' marker-end='url(#ar)'/><line x1='540.0' y1='112.0' x2='562.0' y2='112.0' stroke='#666666' stroke-width='1.5' marker-end='url(#ar)'/><text x='192.0' y='184.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#222222'>à la place de C</text><text x='372.0' y='184.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#222222'>signal carré</text><text x='372.0' y='200.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#222222'>sur D2</text><text x='552.0' y='184.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#222222'>SDA → A4</text><text x='552.0' y='200.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#222222'>SCL → A5</text><rect x='150' y='222' width='460' height='46' rx='8' fill='#f6f7f9' stroke='#d6d6d6' stroke-width='1'/><text x='380.0' y='244.0' font-size='13' text-anchor='middle' font-weight='700' fill='#222222'>f = 1,44 / ((R1 + 2R2)·Cx)   donc   Cx = T / (0,693·(R1 + 2R2))</text><text x='380.0' y='262.0' font-size='11.5' text-anchor='middle' font-weight='400' fill='#666666'>avec R1 + 2R2 = 146 kΩ : Cx (µF) ≈ 9,88 × T (s)</text></svg>